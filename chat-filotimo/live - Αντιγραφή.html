<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0d0d11; overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        .player-container {
            position: relative; width: 100vw; height: 100vh;
        }

        iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: none; display: block; z-index: 1;
        }

        .loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0d0d11; z-index: 15;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; color: #fff;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden { 
            opacity: 0; 
            pointer-events: none; 
        }

        .loading-icon { font-size: 50px; color: #3b82f6; margin-bottom: 20px; }
        .loading-text { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .loading-subtext { font-size: 16px; color: #9ca3af; font-weight: 400; margin-bottom: 30px; }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .offline-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0d0d11; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; color: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .offline-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .offline-icon { font-size: 50px; color: #ef4444; margin-bottom: 20px; }
        .offline-text { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .offline-subtext { font-size: 16px; color: #9ca3af; font-weight: 400; }

        .live-badge {
            position: absolute; top: 26px; right: 30px;
            background: linear-gradient(135deg, #ff4b4b, #ef4444);
            color: white; padding: 8px 16px; border-radius: 8px;
            font-weight: 800; font-size: 12px; z-index: 5;
            display: none; align-items: center; letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
        .live-badge::before {
            content: ''; display: inline-block; width: 6px; height: 6px;
            background-color: #fff; border-radius: 50%; margin-right: 8px;
            animation: blinker 0.8s infinite alternate;
        }
        @keyframes blinker { from { opacity: 1; } to { opacity: 0.3; } }

        .show-live .live-badge { display: flex; }

        .mouse-tracker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20; background: transparent;
        }
        body.hide-cursor, body.hide-cursor * { cursor: none !important; }

        .player-controls-wrapper {
            position: absolute; bottom: 40px; left: 0; right: 0;
            display: flex; justify-content: center; z-index: 30; pointer-events: none;
        }

        .player-controls {
            background: rgba(19, 19, 26, 0.75); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px 28px;
            border-radius: 100px; display: flex; align-items: center; gap: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            opacity: 0; transform: translateY(20px); transition: all 0.5s ease;
            pointer-events: auto;
        }

        .player-controls.visible { opacity: 1; transform: translateY(0); }

        .volume-container {
            display: flex; align-items: center; gap: 12px;
            background: rgba(239, 68, 68, 0.9); padding: 0 20px;
            height: 40px; border-radius: 50px; color: white;
        }

        #volumeIcon { cursor: pointer; font-size: 14px; }

        .volume-slider {
            -webkit-appearance: none; appearance: none; width: 90px; height: 4px;
            background: rgba(255, 255, 255, 0.3); border-radius: 10px; outline: none; cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
            border-radius: 50%; background: #fff;
        }

        .fullscreen-btn {
            background: rgba(255, 255, 255, 0.1); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 22px;
            font-size: 14px; font-weight: 600; border-radius: 50px;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 10px;
        }
        .fullscreen-btn:hover { background: #fff; color: #0d0d11; }
    </style>
</head>
<body> 

    <div class="player-container" id="mainContainer">
        <div class="live-badge">ΖΩΝΤΑΝΑ</div>
        <div class="mouse-tracker" id="tracker"></div>

        <iframe id="vdoPlayer" 
                src="https://vdo.ninja/?view=SiDsgNa&cleanoutput&transparent&autoplay&api=1" 
                allow="autoplay; autofocus; encrypted-media; fullscreen">
        </iframe>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-icon"><i class="fas fa-satellite-dish"></i></div>
            <div class="loading-text">Σύνδεση με τη ροή...</div>
            <div class="loading-subtext">Παρακαλώ περιμένετε</div>
            <div class="spinner"></div>
        </div>

        <div class="offline-overlay" id="offlineOverlay">
            <div class="offline-icon"><i class="fas fa-broadcast-tower"></i></div>
            <div class="offline-text">Δεν είμαστε live αυτή τη στιγμή.</div>
            <div class="offline-subtext">Προσπαθήστε αργότερα.</div>
        </div>

        <div class="player-controls-wrapper">
            <div class="player-controls" id="playerControls">
                <div class="volume-container" id="volumeContainer">
                    <span id="volumeIcon"><i class="fas fa-volume-mute"></i></span>
                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="0">
                </div>
                <button id="fsToggle" class="fullscreen-btn">
                    <i class="fas fa-expand"></i> <span>Πλήρης Οθόνη</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const iframe = document.getElementById('vdoPlayer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const offlineOverlay = document.getElementById('offlineOverlay');
        const container = document.getElementById('mainContainer');
        const controls = document.getElementById('playerControls');
        const tracker = document.getElementById('tracker');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        const fsButton = document.getElementById('fsToggle');

        let lastVideoMessageTime = 0;
        let isLive = false;
        let hasDecided = false; // Έχουμε αποφασίσει αν είμαστε live ή offline;
        let hideTimeout;
        let previousVolume = 50;

        const sendVdoCommand = (command, value) => {
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ [command]: value }, '*');
            }
        };

        iframe.addEventListener('load', () => {
            sendVdoCommand('mute', true);
        });

        function updateVolume(val) {
            const ratio = val / 100;
            volumeSlider.style.background = `linear-gradient(to right, #fff 0%, #fff ${val}%, rgba(255,255,255,0.3) ${val}%, rgba(255,255,255,0.3) 100%)`;

            if (val > 0) {
                sendVdoCommand('mute', false);
                sendVdoCommand('volume', ratio);
                volumeIcon.innerHTML = val < 50 ? '<i class="fas fa-volume-down"></i>' : '<i class="fas fa-volume-up"></i>';
            } else {
                sendVdoCommand('mute', true);
                volumeIcon.innerHTML = '<i class="fas fa-volume-mute"></i>';
            }
            showUI();
        }

        volumeSlider.addEventListener('input', (e) => {
            e.stopPropagation();
            updateVolume(volumeSlider.value);
        });

        volumeIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            if (volumeSlider.value > 0) {
                previousVolume = volumeSlider.value;
                volumeSlider.value = 0;
                updateVolume(0);
            } else {
                volumeSlider.value = previousVolume > 0 ? previousVolume : 100;
                updateVolume(volumeSlider.value);
            }
        });

        fsButton.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        });

        const showUI = () => {
            if (!isLive) return;
            controls.classList.add('visible');
            document.body.classList.remove('hide-cursor');
            clearTimeout(hideTimeout);
            if (parseInt(volumeSlider.value) === 0) return;
            hideTimeout = setTimeout(() => { 
                controls.classList.remove('visible'); 
                document.body.classList.add('hide-cursor'); 
            }, 3500);
        };

        tracker.addEventListener('mousemove', showUI);
        controls.addEventListener('mousemove', showUI);
        container.addEventListener('mousemove', showUI);

        // ΚΡΥΒΕΙ ΤΟ LOADING ΚΑΙ ΕΝΕΡΓΟΠΟΙΕΙ ΤΗΝ ΚΑΤΑΣΤΑΣΗ
        function goLive() {
            if (isLive) return;
            isLive = true;
            hasDecided = true;
            loadingOverlay.classList.add('hidden');
            offlineOverlay.classList.remove('visible');
            container.classList.add('show-live');
            lastVideoMessageTime = Date.now();
            showUI();
        }

        // ΚΡΥΒΕΙ ΤΟ LOADING ΚΑΙ ΔΕΙΧΝΕΙ OFFLINE
        function goOffline() {
            if (!isLive && hasDecided) return; // Ήδη offline, μην ξανακάνεις τίποτα
            isLive = false;
            hasDecided = true;
            loadingOverlay.classList.add('hidden');
            offlineOverlay.classList.add('visible');
            container.classList.remove('show-live');
            controls.classList.remove('visible');
        }

        window.addEventListener('message', (event) => {
            if (!event.data) return;

            // Μηνύματα που δείχνουν ότι υπάρχει πραγματικό video stream
            if (event.data.action === 'video-loaded' || 
                event.data.event === 'wfs-video-loaded' || 
                event.data.streamID) {
                lastVideoMessageTime = Date.now();
                goLive();
            }
            
            // Μηνύματα που δείχνουν ότι κόπηκε το stream
            if (event.data.action === 'stream-dropped' || 
                event.data.event === 'video-removed' || 
                event.data.action === 'stopped') {
                goOffline();
            }
        });

        // Polling - ΜΟΝΟ όταν είμαστε live
        setInterval(() => {
            if (isLive && iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ get_state: true }, '*');
            }
            // Αν είμαστε live αλλά δεν έχουμε λάβει video μήνυμα εδώ και 4 δευτερόλεπτα
            if (isLive && lastVideoMessageTime > 0 && Date.now() - lastVideoMessageTime > 4000) {
                goOffline();
            }
        }, 2000);

        // ΑΡΧΙΚΟ TIMEOUT: Μετά από 5 δευτερόλεπτα, αν δεν έχουμε αποφασίσει, πήγαινε offline
        setTimeout(() => {
            if (!hasDecided) {
                goOffline();
            }
        }, 5000);

        updateVolume(0);
    </script>
</body>
</html>
